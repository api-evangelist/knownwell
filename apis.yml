aid: knownwell
name: Knownwell
description: 'Knownwell is an AI-powered commercial intelligence platform for B2B professional
  services firms, built around client retention and expansion rather than new-logo acquisition.
  The platform ingests communications, CRM records, and enterprise data through connectors
  to Microsoft 365, Google Workspace, Salesforce, HubSpot, Slack, Teams, and conversation
  intelligence tools, then synthesizes an objective Knownwell score for every client
  relationship. Teams use it to detect churn risk before a renewal conversation, surface
  growth opportunities across a portfolio, and track relationship health over time without
  manual data entry. Knownwell publishes a read-only public REST API at api.knownwell.com/ci/v1
  that exposes client scores, score history, portfolios, streams, topics, priorities, notes,
  key people, and the weekly Red/Amber/Green alignment reads a client team files by hand,
  authenticated with an X-API-Key header. Platform pricing is published as a live per-client
  volume calculator rather than named tiers, with a 30-day trial and no per-seat charge. Knownwell was acquired by 2X to
  form a human-agentic GTM services company.'
